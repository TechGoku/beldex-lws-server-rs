name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lws
          POSTGRES_PASSWORD: lws
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lws" --health-interval 5s
    env:
      LWS_TEST_POSTGRES_URL: postgres://lws:lws@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-all-dev libsodium-dev libssl-dev libsqlite3-dev libzmq3-dev libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: actions/cache@v4
        with:
          path: |
            build/kernel
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock', 'kernel/**', '.gitmodules') }}
      - run: make lint
      - run: make test

  # Known vulnerabilities in dependencies; exceptions, with reasons, are in
  # .cargo/audit.toml.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: cargo audit

  # Tagged builds also publish the release archive (bin/, lib/, install.sh).
  dist:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-all-dev libsodium-dev libssl-dev libsqlite3-dev libzmq3-dev libcurl4-openssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: beldex-lws-linux
          path: dist/*.tar.gz
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  # Tagged builds also publish the Docker image to ghcr.io.
  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, audit]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/beldex-lws
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
